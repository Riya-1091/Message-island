<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#cdbdff" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Little Things, Big Planet</title>
    <style>
      :root {
        --ink: #5b4a7a;
        --card: #fff6e8;
        --pill: rgba(255, 246, 232, 0.78);
        --pink: #ff9ec7;
        --lav: #c3a6ff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --ink: #f3e9ff;
          --card: #2f2549;
          --pill: rgba(47, 37, 73, 0.8);
        }
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        background: #cdbdff;
        font-family: "Nunito", "Trebuchet MS", system-ui, sans-serif;
        color: var(--ink);
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .pill {
        background: var(--pill);
        backdrop-filter: blur(8px);
        border-radius: 999px;
        box-shadow: 0 6px 22px rgba(150, 120, 200, 0.28);
        padding: 8px 14px;
        font-weight: 700;
      }
      #say {
        position: fixed;
        transform: translate(-50%, -100%) scale(0.9);
        opacity: 0;
        transition:
          opacity 0.4s,
          transform 0.4s;
        pointer-events: none;
        max-width: 230px;
        text-align: center;
        font-size: 0.85rem;
        line-height: 1.3;
        z-index: 4;
        padding: 8px 14px;
        border-radius: 18px;
      }
      #say.on {
        opacity: 1;
        transform: translate(-50%, -100%) scale(1);
      }
      #emo {
        position: fixed;
        right: 30px;
        bottom: calc(128px + env(safe-area-inset-bottom));
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 0;
        background: var(--pill);
        font-size: 1.6rem;
        box-shadow: 0 6px 22px rgba(150, 120, 200, 0.35);
        cursor: pointer;
        z-index: 2;
        touch-action: none;
      }
      #dream {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 45%,
          rgba(255, 255, 255, 0) 60%,
          rgba(190, 160, 240, 0.22) 100%
        );
      }
      #hud {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: clamp(0.8rem, 3vw, 1rem);
      }
      #hud i {
        font-style: normal;
        opacity: 0.3;
        filter: grayscale(1);
        transition: 0.4s;
        margin-right: 2px;
      }
      #hud i.on {
        opacity: 1;
        filter: none;
      }
      #btns {
        position: fixed;
        top: calc(10px + env(safe-area-inset-top));
        right: 10px;
        display: flex;
        gap: 8px;
      }
      .rb {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 0;
        background: var(--pill);
        font-size: 1.15rem;
        box-shadow: 0 6px 22px rgba(150, 120, 200, 0.28);
        color: var(--ink);
        cursor: pointer;
      }
      #prompt {
        position: fixed;
        left: 50%;
        bottom: calc(150px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        opacity: 0;
        transition: 0.3s;
        pointer-events: none;
        white-space: nowrap;
      }
      #prompt.on {
        opacity: 1;
      }
      #toast {
        position: fixed;
        top: calc(64px + env(safe-area-inset-top));
        left: 50%;
        transform: translate(-50%, -10px);
        opacity: 0;
        transition: 0.4s;
        pointer-events: none;
        text-align: center;
        max-width: 90vw;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #hint {
        position: fixed;
        top: 30%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: 1s;
        pointer-events: none;
        text-align: center;
        font-size: clamp(1rem, 4vw, 1.4rem);
        max-width: 88vw;
      }
      #hint.on {
        opacity: 1;
      }
      #joy,
      #act {
        position: fixed;
        bottom: calc(24px + env(safe-area-inset-bottom));
        display: none;
        touch-action: none;
      }
      #joy {
        left: 24px;
        width: 130px;
        height: 130px;
        border-radius: 50%;
        background: var(--pill);
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 0 0 3px rgba(195, 166, 255, 0.6);
      }
      #knob {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: linear-gradient(#fff, var(--lav));
        box-shadow: 0 4px 12px rgba(120, 90, 180, 0.4);
        pointer-events: none;
      }
      #act {
        right: 24px;
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 0;
        background: linear-gradient(#ffd1e6, var(--pink));
        font-size: 2rem;
        box-shadow: 0 8px 22px rgba(255, 120, 180, 0.45);
        align-items: center;
        justify-content: center;
        opacity: 0.35;
        transition: 0.3s;
      }
      #act.on {
        opacity: 1;
        transform: scale(1.06);
      }
      @media (pointer: coarse), (max-width: 700px) {
        #joy,
        #act {
          display: flex;
        }
      }
      #card {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 440px);
        max-height: 86vh;
        overflow: auto;
        background: var(--card);
        border-radius: 28px;
        padding: 26px 24px 20px;
        box-shadow: 0 16px 60px rgba(100, 70, 160, 0.45);
        z-index: 30;
        transition: 0.35s;
        text-align: center;
      }
      #card.hide {
        opacity: 0;
        transform: translate(-50%, -46%) scale(0.92);
        pointer-events: none;
      }
      #ct {
        white-space: pre-line;
        font-size: clamp(1rem, 3.6vw, 1.2rem);
        line-height: 1.55;
        margin: 6px 0 16px;
      }
      .btn,
      .opt {
        border: 0;
        border-radius: 999px;
        padding: 11px 22px;
        font: inherit;
        font-weight: 800;
        color: #fff;
        background: linear-gradient(#c9b2ff, #a98bf0);
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(130, 100, 200, 0.35);
      }
      .opt {
        display: block;
        width: 100%;
        margin: 8px 0;
        background: linear-gradient(#ffd1e6, #ff9ec7);
      }
      #x {
        position: absolute;
        top: 10px;
        right: 12px;
        background: none;
        border: 0;
        font-size: 1.2rem;
        color: var(--ink);
        cursor: pointer;
        opacity: 0.6;
      }
      #intro {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: radial-gradient(
          circle at 50% 40%,
          #e6d9ff,
          #b9a2f5 70%,
          #9c86e6
        );
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition: opacity 1.6s;
        overflow: hidden;
        color: #fff;
      }
      #intro.hide {
        opacity: 0;
        pointer-events: none;
      }
      .star {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: tw 3s infinite ease-in-out;
      }
      @keyframes tw {
        50% {
          opacity: 0.2;
          transform: scale(0.5);
        }
      }
      #start h1 {
        font-size: clamp(2rem, 9vw, 4rem);
        margin: 0 0 6px;
        text-shadow: 0 4px 24px rgba(120, 80, 200, 0.6);
      }
      #start p {
        margin: 0 0 26px;
        font-size: clamp(1rem, 3.5vw, 1.3rem);
        opacity: 0.9;
      }
      #start.gone {
        display: none;
      }
      #line {
        position: absolute;
        top: 30%;
        opacity: 0;
        transition: opacity 1.4s;
        font-size: clamp(1.2rem, 5vw, 2rem);
        padding: 0 20px;
        text-shadow: 0 2px 16px rgba(120, 80, 200, 0.6);
      }
      #line.on {
        opacity: 1;
      }
      #portal {
        position: absolute;
        width: min(46vw, 200px);
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.2);
        transition:
          transform 2s cubic-bezier(0.6, 0, 0.3, 1),
          opacity 1.5s;
        background: conic-gradient(#fff, #ffd1e6, #c3a6ff, #9fd8ff, #fff);
        box-shadow:
          0 0 60px 20px rgba(255, 255, 255, 0.7),
          inset 0 0 40px 10px rgba(255, 255, 255, 0.9);
        animation: spin 5s linear infinite;
      }
      #portal.on {
        opacity: 1;
        transform: scale(1);
      }
      #portal.enter {
        transform: scale(40);
        opacity: 1;
      }
      @keyframes spin {
        to {
          rotate: 360deg;
        }
      }
      #skip {
        position: fixed;
        right: 14px;
        bottom: calc(14px + env(safe-area-inset-bottom));
        z-index: 25;
        background: var(--pill);
        border: 0;
        border-radius: 999px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 700;
        color: var(--ink);
        cursor: pointer;
      }
      #bub {
        position: fixed;
        inset: 0;
        z-index: 15;
        background: radial-gradient(
          circle at 50% 30%,
          rgba(159, 216, 255, 0.85),
          rgba(100, 160, 230, 0.92)
        );
        touch-action: none;
      }
      #bub.hide,
      #sky.hide,
      #pause.hide {
        display: none;
      }
      #field {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .bubble {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        cursor: pointer;
        background: radial-gradient(
          circle at 30% 28%,
          #fff 0,
          rgba(255, 255, 255, 0.85) 8%,
          rgba(200, 230, 255, 0.35) 45%,
          rgba(255, 200, 240, 0.45) 100%
        );
        box-shadow:
          inset 0 0 14px rgba(255, 255, 255, 0.8),
          0 0 18px rgba(255, 255, 255, 0.5);
        touch-action: none;
      }
      .bubble.pop {
        transition: 0.2s;
        opacity: 0;
        scale: 1.6;
      }
      #bhead {
        position: absolute;
        top: calc(12px + env(safe-area-inset-top));
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        gap: 10px;
        align-items: center;
        pointer-events: none;
      }
      #bhead * {
        pointer-events: auto;
      }
      .sp {
        position: absolute;
        left: 50%;
        top: 45%;
        width: 10px;
        height: 10px;
        background: #fff6a8;
        clip-path: polygon(
          50% 0,
          62% 38%,
          100% 50%,
          62% 62%,
          50% 100%,
          38% 62%,
          0 50%,
          38% 38%
        );
        animation: spk 1.2s forwards;
        z-index: 40;
        pointer-events: none;
      }
      @keyframes spk {
        to {
          transform: translate(var(--dx), var(--dy)) scale(2.4) rotate(200deg);
          opacity: 0;
        }
      }
      #sky {
        position: fixed;
        inset: 0;
        z-index: 12;
        background: radial-gradient(circle, #2b2160, #120d35);
        animation: fi 1.2s;
      }
      @keyframes fi {
        from {
          opacity: 0;
        }
      }
      #pause {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: rgba(120, 90, 190, 0.55);
        backdrop-filter: blur(6px);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        color: #fff;
        font-size: 1.6rem;
        font-weight: 800;
      }

      /* ---- mobile / responsive fixes ---- */
      html,
      body {
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
      }
      @media (max-width: 520px) {
        #hud {
          max-width: calc(100vw - 150px);
          flex-wrap: wrap;
          gap: 3px 6px;
          border-radius: 18px;
          padding: 6px 11px;
          font-size: 0.8rem;
          line-height: 1.25;
        }
        #btns {
          gap: 6px;
          right: 8px;
        }
        .rb {
          width: 40px;
          height: 40px;
          font-size: 1rem;
        }
        #toast {
          top: calc(86px + env(safe-area-inset-top));
          font-size: 0.9rem;
        }
      }
      @media (pointer: coarse), (max-width: 700px) {
        #prompt {
          bottom: calc(172px + env(safe-area-inset-bottom));
          white-space: normal;
          text-align: center;
          max-width: 76vw;
          font-size: 0.9rem;
        }
      }
      @media (max-height: 480px) and (orientation: landscape) {
        #joy {
          width: 104px;
          height: 104px;
          left: calc(18px + env(safe-area-inset-left));
        }
        #knob {
          width: 46px;
          height: 46px;
        }
        #act {
          width: 76px;
          height: 76px;
          font-size: 1.7rem;
          right: calc(18px + env(safe-area-inset-right));
        }
        #emo {
          width: 48px;
          height: 48px;
          font-size: 1.4rem;
          right: calc(28px + env(safe-area-inset-right));
          bottom: calc(108px + env(safe-area-inset-bottom));
        }
        #prompt {
          bottom: calc(16px + env(safe-area-inset-bottom));
          max-width: 50vw;
        }
        #hint {
          top: 24%;
        }
        #card {
          padding: 18px 20px 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="dream"></div>
    <div id="hud" class="pill">
      <i id="i-mail">✉️</i><i id="i-wish">🌸</i><i id="i-scope">🔭</i
      ><i id="i-bubble">🫧</i><i id="i-music">🎵</i><i id="i-lantern">🏮</i
      ><i id="i-stars">⭐</i><i id="i-chest">🎁</i><span id="count">0/4</span>
    </div>
    <div id="btns">
      <button class="rb" id="snd" title="Sound">🔊</button
      ><button class="rb" id="pz" title="Pause">⏸</button
      ><button class="rb" id="rs" title="Restart">↺</button>
    </div>
    <div id="prompt" class="pill"></div>
    <div id="toast" class="pill"></div>
    <div id="hint" class="pill"></div>
    <div id="say" class="pill"></div>
    <button id="emo" title="Emote (Q)">💃</button>
    <div id="joy"><div id="knob"></div></div>
    <button id="act">✋</button>
    <div id="sky" class="hide"></div>
    <div id="bub" class="hide">
      <div id="field"></div>
      <div id="bhead">
        <span class="pill">🫧 <b id="score">0/10</b></span
        ><button class="btn" id="leave">Leave pond</button>
      </div>
    </div>
    <div id="card" class="hide">
      <button id="x">✕</button>
      <div id="ct"></div>
      <div id="co"></div>
      <button class="btn" id="next">Next ▸</button>
    </div>
    <div id="intro">
      <div id="start">
        <h1>Little Things,<br />Big Planet</h1>
        <p>A little world made of little moments.</p>
        <button
          class="btn"
          id="begin"
          style="font-size: 1.2rem; padding: 14px 34px"
        >
          Begin ✨
        </button>
      </div>
      <div id="line"></div>
      <div id="portal"></div>
    </div>
    <button id="skip">Skip intro ▸▸</button>
    <div id="pause" class="hide">
      <div>Paused</div>
      <button class="btn" id="resume">Resume ▸</button>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      const T = THREE,
        $ = (id) => document.getElementById(id);
      const SAVE = "ltbp-v1",
        KEYS = ["mail", "wish", "scope", "bubble", "music", "lantern", "stars"];
      let S = {
        mail: 0,
        wish: 0,
        scope: 0,
        bubble: 0,
        music: 0,
        lantern: 0,
        stars: 0,
        starIds: [],
        chest: 0,
      };
      try {
        Object.assign(S, JSON.parse(localStorage.getItem(SAVE) || "{}"));
      } catch (e) {}
      const save = () => {
        try {
          localStorage.setItem(SAVE, JSON.stringify(S));
        } catch (e) {}
      };
      const allFound = () => KEYS.every((k) => S[k]);

      /* ---------- audio (synthesised, optional) ---------- */
      let AC,
        amb,
        sfxOn = true;
      function audio() {
        if (!AC) {
          try {
            AC = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            return;
          }
        }
        if (AC.state === "suspended") AC.resume();
      }
      function tone(f, d = 0.15, type = "sine", v = 0.12, t0 = 0, slide = 0) {
        if (!AC || !sfxOn) return;
        const o = AC.createOscillator(),
          g = AC.createGain(),
          t = AC.currentTime + t0;
        o.type = type;
        o.frequency.setValueAtTime(f, t);
        if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
        g.gain.setValueAtTime(v, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + d);
        o.connect(g);
        g.connect(AC.destination);
        o.start(t);
        o.stop(t + d);
      }
      const pop = () =>
        tone(450 + Math.random() * 350, 0.12, "sine", 0.16, 0, 2);
      const chime = () =>
        [660, 880, 1100, 1320, 1760].forEach((f, i) =>
          tone(f, 0.5, "sine", 0.07, i * 0.1),
        );
      function ambient() {
        if (amb || !AC) return;
        amb = AC.createGain();
        amb.gain.value = sfxOn ? 0.5 : 0;
        amb.connect(AC.destination);
        [261.63, 329.63, 392, 493.88].forEach((f, i) => {
          const o = AC.createOscillator(),
            g = AC.createGain(),
            l = AC.createOscillator(),
            lg = AC.createGain();
          o.frequency.value = f;
          g.gain.value = 0.03;
          l.frequency.value = 0.08 + i * 0.03;
          lg.gain.value = 0.02;
          l.connect(lg);
          lg.connect(g.gain);
          o.connect(g);
          g.connect(amb);
          o.start();
          l.start();
        });
        const dl = AC.createDelay(2),
          fb = AC.createGain();
        dl.delayTime.value = 0.42;
        fb.gain.value = 0.4;
        dl.connect(fb);
        fb.connect(dl);
        dl.connect(amb);
        const CH = [
          [261.63, 329.63, 392],
          [220, 261.63, 329.63],
          [174.61, 220, 261.63],
          [196, 246.94, 293.66],
        ];
        let st = 0;
        setInterval(() => {
          if (!AC || !sfxOn || paused || AC.state !== "running") return;
          const c = CH[Math.floor(st / 8) % 4],
            f = c[[0, 1, 2, 1, 2, 1, 0, 2][st % 8]] * 2,
            o = AC.createOscillator(),
            g = AC.createGain(),
            t = AC.currentTime;
          o.type = "triangle";
          o.frequency.value = f;
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.12, t + 0.03);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
          o.connect(g);
          g.connect(amb);
          g.connect(dl);
          o.start(t);
          o.stop(t + 1.5);
          if (st % 8 === 0) {
            const b = AC.createOscillator(),
              bg = AC.createGain();
            b.frequency.value = c[0] / 2;
            bg.gain.setValueAtTime(0, t);
            bg.gain.linearRampToValueAtTime(0.1, t + 0.4);
            bg.gain.exponentialRampToValueAtTime(0.001, t + 3.4);
            b.connect(bg);
            bg.connect(amb);
            b.start(t);
            b.stop(t + 3.5);
          }
          st++;
        }, 480);
      }
      $("snd").onclick = () => {
        audio();
        sfxOn = !sfxOn;
        if (amb) amb.gain.value = sfxOn ? 0.5 : 0;
        $("snd").textContent = sfxOn ? "🔊" : "🔇";
      };

      /* ---------- renderer / scene ---------- */
      const renderer = new T.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(
        Math.min(
          devicePixelRatio,
          matchMedia("(pointer:coarse)").matches ? 1.5 : 2,
        ),
      );
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = T.PCFSoftShadowMap;
      renderer.outputEncoding = T.sRGBEncoding;
      renderer.toneMapping = T.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.85;
      document.body.prepend(renderer.domElement);
      const scene = new T.Scene(),
        cam = new T.PerspectiveCamera(50, 1, 0.1, 200);
      const sk = document.createElement("canvas");
      sk.width = 2;
      sk.height = 256;
      {
        const g = sk.getContext("2d"),
          gr = g.createLinearGradient(0, 0, 0, 256);
        gr.addColorStop(0, "#bfa9ff");
        gr.addColorStop(0.55, "#ffd1e6");
        gr.addColorStop(1, "#fff6e8");
        g.fillStyle = gr;
        g.fillRect(0, 0, 2, 256);
      }
      scene.background = new T.CanvasTexture(sk);
      scene.fog = new T.Fog(0xe2c8f0, 2, 14);
      const hemi = new T.HemisphereLight(0xfff4ff, 0xb9a6e8, 0.6);
      scene.add(hemi);

      function applyDay(dt) {

          day = Math.min(1, Math.max(0, (s + 0.25) / 0.6)),
          warm = Math.max(0, 1 - Math.abs(s + 0.05) * 3.2) * 0.85,
          dim = 1 - 0.35 * RAIN;
        NIGHT = 1 - day;
        pond.material.envMapIntensity = 0.25 + 0.9 * day;
        hemi.intensity = (0.5 + 0.12 * day) * dim;
        mixC(hemi.color, 0x9a9cff, 0xfff4ff, day);
        sun.intensity = 1.25 * day * dim;
        sun.position.set(Math.cos(p * 6.2832) * 11, 3 + Math.max(0, s) * 9, 5);
        mixC(sun.color, 0xffe2b8, 0xffa070, warm);
        moon.intensity = 0.35 + 0.3 * NIGHT;
        mixC(moon.color, 0xffb8e0, 0xa7b6ff, NIGHT);
        ffPts.material.size = 0.2 + 0.2 * NIGHT;
        ffG.setDrawRange(0, Math.floor(12 + 18 * NIGHT));
        nStars.material.opacity = 0.9 * NIGHT;
        moonS.material.opacity = 0.85 * NIGHT;
        lampG.material.opacity = 0.5 + 0.5 * NIGHT;
        lampG.scale.setScalar(1.6 + 1.4 * NIGHT);

          nightSaid = true;
          petSay("Night time! Look at all the fireflies.");

        if (NIGHT < 0.3) nightSaid = false;
        skyAcc += dt;
        if (skyAcc > 0.35) {
          skyAcc = 0;
          mixC(topC, 0x1b1650, 0xbfa9ff, day)
            .lerp(tmpC.set(0x8a6bd0), warm)
            .lerp(tmpC.set(0xa9b0cf), RAIN * 0.35);
          mixC(midC, 0x3a2f7a, 0xffd1e6, day)
            .lerp(tmpC.set(0xff9ec7), warm)
            .lerp(tmpC.set(0xa9b0cf), RAIN * 0.35);
          mixC(botC, 0x5a4a9a, 0xfff6e8, day)

          const gr = skyG.createLinearGradient(0, 0, 0, 256);

      /* ---------- tweens & particles ---------- */

          dy = e.clientY - cy;

          l = Math.hypot(dx, dy);

      /* ---------- bubble mini-game ---------- */
      const bub = { open: false, score: 0, list: [] };

      function bounds(b) {

          el = document.createElement("div");

        const b = {
            el,
            s,
            vx: (Math.random() - 0.5) * 60,
            vy: (Math.random() < 0.5 ? -1 : 1) * (18 + Math.random() * 50),
          },
          r = bounds(b);
        b.x = r.minX + Math.random() * (r.maxX - r.minX);
        b.y = r.minY + Math.random() * (r.maxY - r.minY);
        el.style.transform = `translate(${b.x}px,${b.y}px)`;
        el.addEventListener("pointerdown", (e) => {

      function popB(b) {
        if (b.dead || !bub.open) return;

        $("score").textContent = bub.score + "/10";

          const r = bounds(b);
          b.x += b.vx * dt;
          b.y += b.vy * dt;
          if (b.x < r.minX || b.x > r.maxX) {
            b.vx *= -1;
            b.x = Math.min(r.maxX, Math.max(r.minX, b.x));
          }
          if (b.y < r.minY || b.y > r.maxY) {
            b.vy *= -1;
            b.y = Math.min(r.maxY, Math.max(r.minY, b.y));
          }
          b.el.style.transform = `translate(${b.x}px,${b.y}px)`;
        }

        d.className = "star";
        const z = 1 + Math.random() * 3;
        d.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${z}px;height:${z}px;animation-delay:${Math.random() * 3}s`;
        $("intro").prepend(d);
      }
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      async function intro() {
        const id = ++runId,
          w = async (ms) => {
            await sleep(ms);
            return id === runId;
          };
        mode = "enter";
        $("start").classList.add("gone");
        $("line").textContent =
          "Somewhere, a little world is waiting for you...";
        $("line").classList.add("on");
        if (!(await w(3600))) return;
        $("line").classList.remove("on");
        $("portal").classList.add("on");
        chime();
        if (!(await w(2800))) return;
        $("portal").classList.add("enter");
        tone(220, 1.8, "sine", 0.1, 0, 3);
        camStart = performance.now();
        $("intro").style.transitionDelay = "1.2s";
        if (!(await w(1500))) return;
        finishIntro();
      }
      let camStart = 0;
      function finishIntro(skip) {
        $("intro").classList.add("hide");
        $("skip").style.display = "none";
        mode = "play";
        if (skip) camK = 1;
        ghost.visible = true;
        ghostT = skip ? 1 : 0;
        setTimeout(
          () => {
            canMove = true;
            if (!S.chest)
              showHint("Your tiny adventure begins here. Explore around!");
          },
          skip ? 200 : 1500,
        );
      }
      function showHint(t) {
        const h = $("hint");
        h.textContent = touch
          ? t
          : t + "  (WASD / arrows to move, E to interact, Q to emote)";
        h.classList.add("on");
        setTimeout(() => h.classList.remove("on"), 6000);
      }
      $("begin").onclick = () => {
        audio();
        ambient();
        intro();
      };
      $("skip").onclick = () => {
        audio();
        ambient();
        runId++;
        $("start").classList.add("gone");
        finishIntro(true);
      };

      /* ---------- pause / reset ---------- */
      const setPause = (p) => {
        paused = p;
        $("pause").classList.toggle("hide", !p);
      };
      $("pz").onclick = () => {
        if (mode === "play") setPause(true);
      };
      $("resume").onclick = () => setPause(false);
      let rsT;
      $("rs").onclick = () => {
        if ($("rs").textContent === "↺") {
          $("rs").textContent = "❓";
          toast("Tap again to restart the game");
          clearTimeout(rsT);
          rsT = setTimeout(() => ($("rs").textContent = "↺"), 3000);
        } else {
          try {
            localStorage.removeItem(SAVE);
          } catch (e) {}
          location.reload();
        }
      };

      /* ---------- apply saved state ---------- */
      hud();
      if (S.chest) {
        lock.visible = false;
        clid.rotation.x = -1.9;
      }

      /* ---------- main loop ---------- */
      let t = 0,
        last = performance.now();
      const far = new T.Vector3(),
        fp = new T.Vector3(),
        look = new T.Vector3(),
        SPEED = 3.6;
      const elastic = (k) =>
        k >= 1
          ? 1
          : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * 2.094) + 1;
      function loop(now) {
        requestAnimationFrame(loop);
        if (paused) {
          last = now;
          return;
        }
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        t += dt;
        // world animation
        island.position.y = Math.sin(t * 0.8) * 0.12;
        grassU.uTime.value = t;
        for (const s of sway) s.o.rotation.z = Math.sin(t * s.s + s.p) * s.a;
        flag.rotation.z = Math.sin(t * 2) * 0.1;
        pond.material.emissiveIntensity = 0.25 + Math.sin(t * 1.5) * 0.08;
        ripples.forEach((r) => {
          const p = (t * 0.25 + r.userData.o) % 1;
          r.scale.setScalar(0.3 + p * 1.1);
          r.material.opacity = 0.5 * (1 - p);
        });
        ffB.forEach((f, i) => {
          ffP[i * 3] = f[0] + Math.sin(t * 0.6 + f[3]) * 0.5;
          ffP[i * 3 + 1] = f[1] + Math.sin(t + f[3]) * 0.3;
          ffP[i * 3 + 2] = f[2] + Math.cos(t * 0.5 + f[3]) * 0.5;
        });
        ffG.attributes.position.needsUpdate = true;
        clouds.forEach((c) => {
          const d = c.userData;
          d.a += d.s * dt;
          c.position.set(Math.cos(d.a) * d.r, d.y, Math.sin(d.a) * d.r - 4);
          c.lookAt(0, d.y, 0);
        });
        waterTex.offset.set(t * 0.02, t * 0.013);
        pb.forEach((m) => {
          const u = m.userData,
            p = (t * 0.18 + u.o) % 1;
          m.position.set(
            LM.pond.x + Math.cos(u.a + t * 0.3) * u.r,
            0.15 + p * 1.8,
            LM.pond.z + Math.sin(u.a + t * 0.3) * u.r,
          );
          m.material.opacity = 0.5 * Math.sin(p * 3.14);
        });
        cGlow.material.opacity =
          allFound() && !S.chest ? 0.35 + Math.sin(t * 3) * 0.25 : 0;
        for (let i = tw.length - 1; i >= 0; i--) {
          const a = tw[i];
          a.t += dt;
          const k = Math.min(a.t / a.dur, 1);
          a.fn(k);
          if (k >= 1) {
            tw.splice(i, 1);
            a.done && a.done();
          }
        }
        for (let i = fx.length - 1; i >= 0; i--) {
          const f = fx[i];
          f.age += dt;
          for (let j = 0; j < f.vel.length; j++) {
            f.vel[j][1] += f.grav * dt;
            f.pos[j * 3] += f.vel[j][0] * dt;
            f.pos[j * 3 + 1] += f.vel[j][1] * dt;
            f.pos[j * 3 + 2] += f.vel[j][2] * dt;
          }
          f.g.attributes.position.needsUpdate = true;
          f.m.opacity = Math.max(0, 1 - f.age / f.life);
          if (f.age > f.life) {
            scene.remove(f.pts);
            f.g.dispose();
            f.m.dispose();
            fx.splice(i, 1);
          }
        }
        if (bub.open) bubUpdate(dt);
        // player
        let mx =
            (keys.d || keys.arrowright ? 1 : 0) -
            (keys.a || keys.arrowleft ? 1 : 0) +
            joy.x,
          mz =
            (keys.s || keys.arrowdown ? 1 : 0) -
            (keys.w || keys.arrowup ? 1 : 0) +
            joy.y;
        const ml = Math.hypot(mx, mz);
        if (ml > 1) {
          mx /= ml;
          mz /= ml;
        }
        const moving = canMove && ml > 0.08 && emote.dur <= 0;
        if (moving) {
          P.x += mx * SPEED * dt;
          P.z += mz * SPEED * dt;
          let a = Math.atan2(mx, mz),
            cur = body.rotation.y,
            df = Math.atan2(Math.sin(a - cur), Math.cos(a - cur));
          body.rotation.y += df * Math.min(1, dt * 10);
          const r = Math.hypot(P.x, P.z);
          if (r > RL) {
            P.x *= RL / r;
            P.z *= RL / r;
          }
          for (const o of obst) {
            const dx = P.x - o.x,
              dz = P.z - o.z,
              d = Math.hypot(dx, dz),
              m = o.r + 0.35;
            if (d < m && d > 0) {
              P.x = o.x + (dx / d) * m;
              P.z = o.z + (dz / d) * m;
            }
          }
        }
        const bob = Math.sin(t * 3) * 0.08,
          gs = ghostT < 1 ? elastic(ghostT) : 1;
        if (ghostT < 1 && mode === "play")
          ghostT = Math.min(1, ghostT + dt / 1.1);
        ghost.position.set(
          P.x,
          0.35 + bob + island.position.y + (1 - gs) * 2,
          P.z,
        );
        ghost.scale.setScalar(Math.max(0.01, gs));
        body.rotation.z = moving ? Math.sin(t * 10) * 0.12 : 0;
        body.rotation.x = moving ? 0.15 : Math.sin(t * 1.5) * 0.03;
        body.scale.set(1, 1 + Math.sin(t * 3) * 0.03, 1);
        const blink = Math.sin(t * 1.7) > 0.985 ? 0.1 : 1.3;
        eyes.forEach((e) => (e.scale.y = blink));
        gGlow.material.opacity = 0.45 + NIGHT * 0.35 + Math.sin(t * 2) * 0.1;
        applyDay(dt);
        weather(dt);
        emoteUpdate(dt);
        petUpdate(dt);
        toysUpdate(dt);
        starM.forEach((g, i) => {
          if (!g.visible) return;
          g.position.y = 1 + Math.sin(t * 2 + i) * 0.2;
          g.rotation.y = t * 1.5;
          if (canMove && Math.hypot(P.x - g.position.x, P.z - g.position.z) < 1)
            collectStar(i);
        });
        // prompt
        const n = canMove ? nearest() : null,
          pr = $("prompt");
        if (n) {
          const lab = {
            mailbox: "Check the mailbox",
            wishTree: "Make a wish",
            pond: S.bubble ? "Visit the pond" : "Pop some bubbles",
            telescope: "Look through the telescope",
            music: "Play the melody stones",
            lantern: "Release a lantern",
            chest: allFound() ? "Open the treasure!" : "Treasure chest 🔒",
            swing: "Hop on the swing",
            seesaw: "Hop on the seesaw",
            carousel: "Spin the merry-go-round",
          }[n];
          pr.textContent = lab + (touch ? "" : " — press E");
          pr.classList.add("on");
          $("act").classList.add("on");
        } else {
          pr.classList.remove("on");
          $("act").classList.remove("on");
        }
        // camera
        const d = cam.userData.d;
        fp.set(P.x * 0.6, d * 0.75, P.z * 0.6 + d * 0.62);
        look.set(P.x * 0.6, 0, P.z * 0.6);
        if (mode === "play") {
          cam.position.lerp(fp, 1 - Math.exp(-dt * 5));
          scene.fog.near = 34;
          scene.fog.far = 90;
          if (camK < 1) camK = 1;
        } else {
          if (mode === "enter" && camStart)
            camK = Math.min(1, (performance.now() - camStart) / 3200);
          far.set(Math.sin(t * 0.2) * 10, 34, 48);
          const k = ease(camK);
          cam.position.lerpVectors(far, fp, k);
          scene.fog.near = 2 + 32 * k;
          scene.fog.far = 14 + 76 * k;
        }
        cam.lookAt(look);
        renderer.render(scene, cam);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
